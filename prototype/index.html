<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Credit Clean — iFood Pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ══════════════════════════════════════════════════════
   iFood Pago Brand Identity — Credit Clean Prototype
   ══════════════════════════════════════════════════════ */
:root {
  --red: #EA1D2C;
  --red-dark: #C41522;
  --red-light: #FDE8EA;
  --cream: #F5F0EB;
  --white: #FFFFFF;
  --dark: #404040;
  --gray: #757575;
  --gray-light: #E0E0E0;
  --gray-bg: #F8F8F8;
  --green: #2E7D32;
  --blue: #1565C0;
  --yellow: #F9A825;
  --orange: #E65100;
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --radius-card: 12px;
  --radius-btn: 24px;
  --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-family);
  background: var(--gray-bg);
  color: var(--dark);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#app {
  width: 100%;
  max-width: 390px;
  min-height: 844px;
  background: var(--white);
  position: relative;
  overflow-x: hidden;
}

/* Header */
.header {
  background: var(--red);
  color: var(--white);
  padding: var(--spacing-lg) var(--spacing-md);
  text-align: center;
}

.header-logo {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.header-sub {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.85;
  margin-top: 4px;
}

/* Screens */
.screen { display: none; padding: var(--spacing-md); }
.screen.active { display: block; }

/* Cards */
.card {
  background: var(--white);
  border-radius: var(--radius-card);
  border: 1px solid var(--gray-light);
  padding: var(--spacing-md);
  margin-bottom: var(--spacing-md);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 44px;
  padding: var(--spacing-sm) var(--spacing-lg);
  border: none;
  border-radius: var(--radius-btn);
  font-family: var(--font-family);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, opacity 0.2s;
  text-align: center;
}

.btn-primary {
  background: var(--red);
  color: var(--white);
}

.btn-primary:hover, .btn-primary:active {
  background: var(--red-dark);
}

.btn-secondary {
  background: var(--cream);
  color: var(--dark);
}

.btn-secondary:hover, .btn-secondary:active {
  background: var(--gray-light);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Progress indicator */
.progress-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: var(--spacing-lg);
}

.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gray-light);
  transition: background 0.3s;
}

.progress-dot.active { background: var(--red); }
.progress-dot.done { background: var(--green); }

/* Merchant list */
.merchant-list { list-style: none; }

.merchant-item {
  display: flex;
  align-items: center;
  padding: var(--spacing-sm) var(--spacing-md);
  min-height: 44px;
  border-bottom: 1px solid var(--gray-light);
  cursor: pointer;
  transition: background 0.15s;
}

.merchant-item:hover, .merchant-item:active {
  background: var(--cream);
}

.merchant-item:last-child { border-bottom: none; }

.merchant-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--red);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  margin-right: var(--spacing-sm);
  flex-shrink: 0;
}

.merchant-info { flex: 1; min-width: 0; }
.merchant-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.merchant-city {
  font-size: 12px;
  color: var(--gray);
}

/* Score display */
.score-hero {
  text-align: center;
  padding: var(--spacing-lg) 0;
}

.score-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 0 auto var(--spacing-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 5px solid;
  transition: border-color 0.5s;
}

.score-circle.excellent { border-color: var(--green); }
.score-circle.good { border-color: var(--blue); }
.score-circle.fair { border-color: var(--yellow); }
.score-circle.developing { border-color: var(--orange); }
.score-circle.insufficient { border-color: var(--gray-light); }

.score-value {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
}

.score-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--gray);
  margin-top: 2px;
}

.tier-badge {
  display: inline-block;
  padding: 4px 16px;
  border-radius: var(--radius-btn);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
}

.tier-badge.excellent { background: #E8F5E9; color: var(--green); }
.tier-badge.good { background: #E3F2FD; color: var(--blue); }
.tier-badge.fair { background: #FFF8E1; color: #F57F17; }
.tier-badge.developing { background: #FFF3E0; color: var(--orange); }
.tier-badge.insufficient { background: var(--gray-light); color: var(--gray); }

/* Category bars */
.category-list { margin-top: var(--spacing-lg); }

.category-item { margin-bottom: var(--spacing-sm); }

.category-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 4px;
}

.category-name { font-weight: 600; }
.category-score { color: var(--gray); }

.category-bar {
  height: 8px;
  background: var(--gray-light);
  border-radius: 4px;
  overflow: hidden;
}

.category-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s ease-out;
}

.category-fill.revenue { background: var(--red); }
.category-fill.reliability { background: var(--blue); }
.category-fill.growth { background: var(--green); }
.category-fill.maturity { background: var(--orange); }

/* Offer screen */
.offer-header {
  text-align: center;
  margin-bottom: var(--spacing-lg);
}

.offer-amount {
  font-size: 36px;
  font-weight: 800;
  color: var(--red);
}

.offer-subtitle {
  font-size: 13px;
  color: var(--gray);
  margin-top: 4px;
}

.term-options {
  display: flex;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
  flex-wrap: wrap;
}

.term-btn {
  flex: 1;
  min-width: 80px;
  min-height: 44px;
  border: 2px solid var(--gray-light);
  border-radius: var(--radius-card);
  background: var(--white);
  font-family: var(--font-family);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-align: center;
  padding: var(--spacing-xs);
}

.term-btn.selected {
  border-color: var(--red);
  background: var(--red-light);
}

.rate-display {
  text-align: center;
  padding: var(--spacing-md);
  background: var(--cream);
  border-radius: var(--radius-card);
  margin-bottom: var(--spacing-md);
}

.rate-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--dark);
}

.rate-label {
  font-size: 12px;
  color: var(--gray);
}

/* Terms screen */
.terms-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: var(--spacing-md);
}

.terms-table td {
  padding: var(--spacing-sm) 0;
  font-size: 14px;
}

.terms-table td:first-child {
  color: var(--gray);
  padding-right: var(--spacing-md);
}

.terms-table td:last-child {
  text-align: right;
  font-weight: 600;
}

.terms-divider {
  border-top: 1px solid var(--gray-light);
  margin: var(--spacing-md) 0;
}

.terms-notice {
  background: var(--cream);
  border-radius: var(--radius-card);
  padding: var(--spacing-md);
  font-size: 12px;
  color: var(--dark);
  line-height: 1.5;
}

.terms-notice strong {
  color: var(--red);
}

/* Not found / error states */
.empty-state {
  text-align: center;
  padding: var(--spacing-xl) var(--spacing-md);
}

.empty-state-icon { font-size: 48px; margin-bottom: var(--spacing-md); }

.empty-state-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: var(--spacing-sm);
}

.empty-state-text {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.5;
}

/* Insufficient tier */
.insufficient-hints {
  text-align: left;
  font-size: 13px;
  line-height: 1.6;
  color: var(--dark);
}

.insufficient-hints li {
  margin-bottom: 4px;
}

/* Pago trust */
.pago-trust {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: var(--spacing-md);
  padding: var(--spacing-sm);
  font-size: 11px;
  color: var(--gray);
}

.pago-trust-icon {
  width: 16px;
  height: 16px;
  background: var(--green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 10px;
  font-weight: 800;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.screen.active { animation: fadeIn 0.3s ease-out; }

@keyframes countUp {
  from { opacity: 0; }
  to { opacity: 1; }
}

.score-animated { animation: countUp 0.6s ease-out; }
</style>

    <div class="pago-trust">
      <div class="pago-trust-icon">✓</div>
      Crédito iFood Pago

  </div>
</div>

// ══════════════════════════════════════════════════════
// Credit Scoring Engine
// ══════════════════════════════════════════════════════

// Normalize value to [0,1] range, treat null/undefined as 0
function normalize(value, min, max) {
  if (value === null || value === undefined) return 0;
  if (max <= min) return 0;
  var clamped = Math.min(Math.max(value, min), max);
  return (clamped - min) / (max - min);
}

// Extract daily orders from profile (handles different field names)
function getDailyOrders(profile) {
  var ph = profile.performance_and_commercial_health;
  if (ph.avg_daily_orders !== null && ph.avg_daily_orders !== undefined) return ph.avg_daily_orders;
  var total = 0;
  if (ph.avg_daily_orders_dinner !== null && ph.avg_daily_orders_dinner !== undefined) total += ph.avg_daily_orders_dinner;
  if (ph.avg_daily_orders_lunch !== null && ph.avg_daily_orders_lunch !== undefined) total += ph.avg_daily_orders_lunch;
  return total || 0;
}

// Revenue Capacity (40% weight)
function computeRevenueScore(merchant) {
  var p = merchant.lcm_profile;
  var ph = p.performance_and_commercial_health;
  var cf = p.customer_conversion_funnel;
  var dailyOrders = getDailyOrders(p);
  var ticket = merchant.average_ticket || 0;
  var monthlyRevenue = dailyOrders * ticket * 30;
  return normalize(monthlyRevenue, 0, 5000) * 0.25
       + normalize(cf.catalog_visits_4w, 0, 15000) * 0.08
       + normalize(cf.purchase_pct, 0, 30) * 0.07;
}

// Operational Reliability (30% weight)
function computeReliabilityScore(merchant) {
  var p = merchant.lcm_profile;
  var ph = p.performance_and_commercial_health;
  var df = p.delivery_and_fulfillment;
  return normalize(ph.customer_rating, 0, 5) * 0.12
       + (1 - normalize(ph.cancellation_rate_pct, 0, 10)) * 0.08
       + normalize(ph.quality_score, 0, 5) * 0.05
       + (1 - normalize(df.late_delivery_pct, 0, 30)) * 0.05;
}

// Growth Trajectory (20% weight)
function computeGrowthScore(merchant) {
  var p = merchant.lcm_profile;
  var ph = p.performance_and_commercial_health;
  var cf = p.customer_conversion_funnel;

  // Trending momentum from top_trending_items
  var trending = p.top_trending_items || [];
  var momentum = 0;
  for (var i = 0; i < trending.length; i++) {
    var item = trending[i];
    var match = item.match(/share\s+([\d.]+)%\s*->\s*([\d.]+)%/);
    if (match) {
      var from = parseFloat(match[1]) || 0;
      var to = parseFloat(match[2]) || 0;
      momentum += (to - from);
    }
  }
  // Normalize momentum: max ~15% total share shift across items
  var momentumNorm = normalize(momentum, 0, 15);

  // Funnel health: ratio of added_to_cart to purchase
  var funnelHealth = 0;
  if (cf.added_to_cart_pct && cf.purchase_pct && cf.added_to_cart_pct > 0) {
    // Higher purchase_pct relative to added_to_cart_pct = better funnel
    var ratio = cf.purchase_pct / cf.added_to_cart_pct;
    funnelHealth = Math.min(ratio, 1);
  }

  return momentumNorm * 0.10
       + normalize(ph.total_reviews, 0, 800) * 0.05
       + funnelHealth * 0.05;
}

// Business Maturity (10% weight)
function computeMaturityScore(merchant) {
  var p = merchant.lcm_profile;
  var ph = p.performance_and_commercial_health;

  // Classification bonus
  var classBonus = 0;
  var cls = merchant.performance_classification;
  if (cls === 'CONTA ESTRATEGICA') classBonus = 1;
  else if (cls === 'LONG TAIL') classBonus = 0.4;
  else classBonus = 0.2; // null or unrecognized

  // Daypart diversity: more dayparts = higher score
  var dp = ph.dominant_daypart || '';
  var dpLower = dp.toLowerCase();
  var diversity = 0;
  if (dpLower.indexOf('lunch') >= 0 && dpLower.indexOf('dinner') >= 0) diversity = 1;
  else if (dpLower.indexOf(' and ') >= 0 || dpLower.indexOf('&') >= 0) diversity = 0.8;
  else if (dpLower.indexOf(' or ') >= 0) diversity = 0.6;
  else diversity = 0.3; // single daypart

  return normalize(ph.chain_locations, 1, 10) * 0.04
       + classBonus * 0.04
       + diversity * 0.02;
}

// Compute credit score from LCM profile data
function computeCreditScore(merchant) {
  var revenue = computeRevenueScore(merchant);
  var reliability = computeReliabilityScore(merchant);
  var growth = computeGrowthScore(merchant);
  var maturity = computeMaturityScore(merchant);
  var score = Math.round((revenue + reliability + growth + maturity) * 1000);
  score = Math.min(Math.max(score, 0), 1000);
  return {
    score: score,
    revenue: Math.round(revenue * 1000),
    reliability: Math.round(reliability * 1000),
    growth: Math.round(growth * 1000),
    maturity: Math.round(maturity * 1000),
    tier: getTierForScore(score)
  };
}

// Tier mapping per constitution
var TIERS = [
  { name: 'Excellent', minScore: 800, maxScore: 1000, maxLimit: 10000, terms: [3, 6, 9], rate: 0.032, tag: 'excellent' },
  { name: 'Good', minScore: 600, maxScore: 799, maxLimit: 7000, terms: [3, 6], rate: 0.035, tag: 'good' },
  { name: 'Fair', minScore: 400, maxScore: 599, maxLimit: 4000, terms: [3, 6], rate: 0.04, tag: 'fair' },
  { name: 'Developing', minScore: 200, maxScore: 399, maxLimit: 2000, terms: [3], rate: 0.045, tag: 'developing' },
  { name: 'Insufficient', minScore: 0, maxScore: 199, maxLimit: 0, terms: [], rate: 0, tag: 'insufficient' }
];

function getTierForScore(score) {
  for (var i = 0; i < TIERS.length; i++) {
    if (score >= TIERS[i].minScore && score <= TIERS[i].maxScore) {
      return TIERS[i];
    }
  }
  return TIERS[TIERS.length - 1];
}

// ══════════════════════════════════════════════════════
// Formatters
// ══════════════════════════════════════════════════════
function fmtBRL(value) {
  return 'R$' + value.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtPct(value) {
  return value.toFixed(1).replace('.', ',') + '%';
}

function fmtRateMonthly(rate) {
  return (rate * 100).toFixed(1).replace('.', ',') + '% ao mês';
}

function fmtRateWeekly(rate) {
  return (rate * 100).toFixed(1).replace('.', ',') + '% por semana';
}

// Screen Navigation
// ══════════════════════════════════════════════════════
function showScreen(name) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.remove('active');
  }
  var target = document.getElementById('screen-' + name);
  if (target) {
    target.classList.add('active');
    appState.currentScreen = name;
  }
}

// Merchant Selection
// ══════════════════════════════════════════════════════
function selectMerchant(merchantId) {
  var merchant = LCM_USERS.find(function(m) { return m.merchant_id === merchantId; });
  if (!merchant) {
    var err = document.getElementById('selectError');
    err.style.display = 'block';
    err.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">Estabelecimento não encontrado</div><div class="empty-state-text">O ID informado não corresponde a nenhum restaurante cadastrado.</div></div>';
    err.className = 'card';
    return;
  }
  document.getElementById('selectError').style.display = 'none';
  appState.selectedMerchant = merchant;
  appState.creditResult = computeCreditScore(merchant);
  renderScoreScreen();
  showScreen('score');
}

function selectTerm(months) {

  for (var i = 0; i < buttons.length; i++) {

  // Find and select the matching button
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i].textContent.indexOf(String(months)) >= 0) {
      buttons[i].classList.add('selected');
    }
  }
}

// ══════════════════════════════════════════════════════
// Terms / Boleto Calculation
// ══════════════════════════════════════════════════════
function calculateBoletoPlan(principal, months, monthlyRate) {
  var weeklyRate = Math.pow(1 + monthlyRate, 1/4) - 1;
  var numParcels = Math.round(months * 4.333); // 4.333 weeks per month
  var totalCost = 0;
  var remainingBalance = principal;
  var parcels = [];

  for (var i = 0; i < numParcels; i++) {
    var principalPortion = principal / numParcels;
    var interestPortion = remainingBalance * weeklyRate;
    var boletoAmount = principalPortion + interestPortion;
    parcels.push(boletoAmount);
    totalCost += boletoAmount;
    remainingBalance -= principalPortion;
  }

  var totalInterest = totalCost - principal;
  var CET = Math.pow(1 + monthlyRate, 12) - 1;

  return {
    numParcels: numParcels,
    weeklyRate: weeklyRate,
    parcels: parcels,
    firstParcel: parcels.length > 0 ? parcels[0] : 0,
    totalCost: totalCost,
    totalInterest: totalInterest,
    CET: CET
  };
}

function proceedToTerms() {
  renderTermsScreen();
  showScreen('terms');
}

function renderTermsScreen() {
  var tier = appState.creditResult.tier;
  var amount = appState.selectedAmount;
  var months = appState.selectedTerm;

  // Ensure amount is within tier limit
  if (amount > tier.maxLimit) amount = tier.maxLimit;

  var plan = calculateBoletoPlan(amount, months, tier.rate);

  var jurosDia = tier.rate / 30; // daily interest ~ monthly/30
  var multa = 0.02; // 2% late fee

  var html = '<h2 style="font-size:18px;font-weight:700;margin-bottom:16px">Resumo da Oferta</h2>';

  html += '<div class="card">' +
    '<h3 style="font-size:14px;margin-bottom:12px">' + appState.selectedMerchant.trading_name + '</h3>' +
    '<table class="terms-table">' +
      '<tr><td>Valor solicitado</td><td>' + fmtBRL(amount) + '</td></tr>' +
      '<tr><td>Prazo</td><td>' + months + ' meses</td></tr>' +
      '<tr><td>Taxa de juros</td><td>' + fmtRateMonthly(tier.rate) + '</td></tr>' +
    '</table>' +
  '</div>';

  html += '<div class="card">' +
    '<h3 style="font-size:14px;margin-bottom:12px">Plano de Pagamento</h3>' +
    '<table class="terms-table">' +
      '<tr><td>Número de boletos</td><td><strong>' + plan.numParcels + ' boletos semanais</strong></td></tr>' +
      '<tr><td>Valor de cada boleto</td><td><strong>' + fmtBRL(Math.round(plan.firstParcel)) + '</strong> (aproximado)</td></tr>' +
      '<tr class="terms-divider"><td>Total a pagar</td><td><strong style="color:var(--red);font-size:16px">' + fmtBRL(Math.round(plan.totalCost)) + '</strong></td></tr>' +
      '<tr><td>Total de juros</td><td>' + fmtBRL(Math.round(plan.totalInterest)) + '</td></tr>' +
      '<tr><td>Custo Efetivo Total (CET)</td><td>' + fmtPct(plan.CET * 100) + ' ao ano</td></tr>' +
    '</table>' +
  '</div>';

  html += '<div class="terms-notice">' +
    '<p style="font-weight:700;margin-bottom:8px">Regras de Pagamento</p>' +
    '<p style="margin-bottom:6px">📅 <strong>Pagamento sequencial:</strong> O próximo boleto é liberado somente após o pagamento do boleto anterior. Isso significa que os valores são cobrados um de cada vez — você não recebe todos os boletos de uma vez.</p>' +
    '<p style="margin-bottom:6px">⚠️ <strong>Em caso de atraso:</strong> juros de ' + fmtPct(jurosDia * 100) + ' ao dia + multa de ' + fmtPct(multa * 100) + ' sobre o valor da parcela em atraso.</p>' +
    '<p>✅ <strong>Em dia:</strong> Seus pagamentos em dia constroem seu histórico positivo e podem aumentar seu limite em futuras solicitações.</p>' +
  '</div>';

  document.getElementById('termsContent').innerHTML = html;
}

document.getElementById('btnToOffer').addEventListener('click', function() {
  renderOfferScreen();
  showScreen('offer');
});

  appState = {
    selectedMerchant: null,
    creditResult: null,
    selectedAmount: 0,
    selectedTerm: 0,
    currentScreen: 'select'
  };
  showScreen('select');
});

// Initialize
renderMerchantList();
